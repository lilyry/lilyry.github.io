</head>
<body>

    <nav>
        <a href="index.html">Home</a>

        <a href="events.html">Events</a>
        <a href="travel.html">Travel</a>
        <a href="contact.html">Contact Me</a>
    </nav>

    <div class="container">
        <div class="hero-collage-container">
    <div class="hero-text">
        <!-- The Javascript will automatically type inside this H1 -->
        <h1 id="typewriter"></h1>
        
        <!-- This div keeps the text hidden until the typing is done -->
        <div class="fade-in-content">
            <p>I'm a student at the Universirty of Illinois Urbana Champaign graduating with a B.S. in Information Scince + Data Scienece with a Minor in Global Studies in May 2026. I made this website to share my projects, events, and travels.</p>
            <a href="contact.html" class="file-link">Get in Touch</a>
        </div>
    </div>
    
    <div class="hero-images">
        <!-- Main Portrait -->
        <img src="images/me-cropped.jpg" alt="Picture of Me" class="main-portrait">
        <!-- Overlapping Interest 1 (e.g., Travel or Event) -->
        <img src="images/poland/IMG_2489.JPG" alt="Travel Interest" class="overlap-1">
        <!-- Overlapping Interest 2 (e.g., Data, Storyboard, or YMCA) -->
        <img src="images/me-talking2.jpeg" alt="Work Interest" class="overlap-2">
    </div>
</div>

<!-- JavaScript for the Typewriter Effect -->
<script>
    // 1. Put the exact text you want typed out inside these quotes
    const textToType = "Welcome, I'm Lily";
    const typingSpeed = 60; // Speed in milliseconds (lower is faster)
    let i = 0;

    function typeWriter() {
        if (i < textToType.length) {
            document.getElementById("typewriter").innerHTML += textToType.charAt(i);
            i++;
            setTimeout(typeWriter, typingSpeed);
        }
    }

    // Start the typing effect as soon as the page loads
    window.onload = typeWriter;
</script>
</body>
</html>
