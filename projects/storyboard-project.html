    <!-- The Lightbox/Modal (Hidden by default) -->
    <!-- Clicking anywhere on the dark background will also close it -->
    <div id="myLightbox" class="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close">&times;</span>
        <img id="lightbox-img" alt="Enlarged Storyboard">
    </div>

    <!-- JavaScript to make the Lightbox work -->
    <script>
        function openLightbox(imageSrc) {
            var lightbox = document.getElementById('myLightbox');
            var lightboxImg = document.getElementById('lightbox-img');
            
            // Set the clicked image as the source for the popup
            lightboxImg.src = imageSrc;
            
            // Show the lightbox (flex is used to center the image)
            lightbox.style.display = 'flex';
        }

        function closeLightbox() {
            var lightbox = document.getElementById('myLightbox');
            // Hide the lightbox
            lightbox.style.display = 'none';
        }
    </script>
