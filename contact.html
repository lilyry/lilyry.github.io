<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-columns {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            margin-top: 24px;
        }
        .contact-col {
            flex: 1;
            min-width: 0;
        }
        /* Tighten form spacing so both forms fit above the fold */
        .contact-col .contact-form label {
            font-size: 0.88rem;
            margin-bottom: 3px;
        }
        .contact-col .contact-form input,
        .contact-col .contact-form textarea {
            padding: 7px 10px;
            font-size: 0.9rem;
            margin-bottom: 10px;
        }
        .contact-col .contact-form textarea {
            height: 82px;
        }
        .contact-col .contact-form button {
            padding: 8px 18px;
            font-size: 0.9rem;
        }
        /* LinkedIn card styles */
        .linkedin-card p {
            margin: 0 0 16px;
            font-size: 0.92rem;
            opacity: 0.85;
            line-height: 1.5;
        }
        .category .linkedin-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #1E3A5F;
            color: white;
            padding: 10px 16px;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.95rem;
            transition: background 0.2s ease;
        }
        .category .linkedin-btn:hover {
            background: #2D5A3D;
            color: white;
        }
        @media (max-width: 800px) {
            .contact-columns {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="events.html">Events</a>
        <a href="travel.html">Travel</a>
        <a href="contact.html">Contact Me</a>
    </nav>

    <div class="container">
        <h1>Contact Me</h1>
        <p>I'd love to hear from you — send a message, request my resume, or connect on LinkedIn.</p>

        <div class="contact-columns">

            <!-- LinkedIn -->
            <div class="category contact-col">
                <h2>Connect</h2>
                <div class="linkedin-card">
                    <p>Find me on LinkedIn</p>
                    <a class="linkedin-btn" href="https://www.linkedin.com/in/lily-rybka/" target="_blank">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                            <path d="M20.447 20.452H17.21v-5.569c0-1.327-.024-3.037-1.852-3.037-1.853 0-2.137 1.446-2.137 2.94v5.666H9.984V9h3.102v1.561h.044c.432-.817 1.486-1.679 3.059-1.679 3.27 0 3.874 2.152 3.874 4.95v6.62zM5.337 7.433a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6zm1.558 13.019H3.779V9h3.116v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
                        </svg>
                        linkedin.com/in/lily-rybka
                    </a>
                </div>
            </div>

            <!-- Send a Message -->
            <div class="category contact-col">
                <h2>Send a Message</h2>
                <form id="contact-form" class="contact-form" novalidate>
                    <input type="hidden" name="access_key" value="cd5aeb23-773b-4cfb-bdaf-c1c4a9a24f24">
                    <input type="hidden" name="subject" value="New message — lilyrybka.com">
                    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

                    <label for="contact-name">Name</label>
                    <input type="text" id="contact-name" name="name" placeholder="Your name" required>

                    <label for="contact-email">Email</label>
                    <input type="email" id="contact-email" name="email" placeholder="your@email.com" required>

                    <label for="contact-message">Message</label>
                    <textarea id="contact-message" name="message" placeholder="Your message..." required></textarea>

                    <button type="submit">Send Message</button>
                    <div class="form-status" id="contact-status"></div>
                </form>
            </div>

            <!-- Request My Resume -->
            <div class="category contact-col" id="resume-request">
                <h2>Request My Resume</h2>
                <form id="resume-form" class="contact-form" novalidate>
                    <input type="hidden" name="access_key" value="cd5aeb23-773b-4cfb-bdaf-c1c4a9a24f24">
                    <input type="hidden" name="subject" value="Resume request — lilyrybka.com">
                    <input type="checkbox" name="botcheck" style="display:none" tabindex="-1" autocomplete="off">

                    <label for="resume-name">Name</label>
                    <input type="text" id="resume-name" name="name" placeholder="Your name" required>

                    <label for="resume-email">Email</label>
                    <input type="email" id="resume-email" name="email" placeholder="your@email.com" required>

                    <label for="resume-org">Organization <span style="font-weight:normal; opacity:0.65;">(optional)</span></label>
                    <input type="text" id="resume-org" name="org" placeholder="ex. 'Company name'">

                    <p style="margin: 4px 0 12px; font-size:0.88rem; opacity:0.75;">Fill out this form and I'll send my resume to your inbox.</p>
                    <button type="submit">Request Resume</button>
                    <div class="form-status" id="resume-status"></div>
                </form>
            </div>

        </div>
    </div>

    <script>
        function attachForm(formId, statusId, submitLabel, successMsg) {
            const form = document.getElementById(formId);
            const status = document.getElementById(statusId);

            form.addEventListener('submit', async function (e) {
                e.preventDefault();

                const inputs = form.querySelectorAll('input[required], textarea[required]');
                let valid = true;
                inputs.forEach(function (el) {
                    if (!el.value.trim()) valid = false;
                });
                if (!valid) {
                    status.className = 'form-status form-error';
                    status.textContent = 'Please fill in all required fields.';
                    return;
                }

                const btn = form.querySelector('button[type="submit"]');
                btn.disabled = true;
                btn.textContent = 'Sending…';
                status.className = 'form-status';
                status.textContent = '';

                const data = Object.fromEntries(new FormData(form));

                try {
                    const res = await fetch('https://api.web3forms.com/submit', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
                        body: JSON.stringify(data)
                    });
                    const json = await res.json();

                    if (json.success) {
                        status.className = 'form-status form-success';
                        status.textContent = successMsg;
                        form.reset();
                    } else {
                        throw new Error(json.message || 'Submission failed');
                    }
                } catch (_) {
                    status.className = 'form-status form-error';
                    status.textContent = 'Something went wrong. Please try again or reach out on LinkedIn.';
                } finally {
                    btn.disabled = false;
                    btn.textContent = submitLabel;
                }
            });
        }

        attachForm('contact-form', 'contact-status', 'Send Message', "Message sent!");
        attachForm('resume-form', 'resume-status', 'Request Resume', "Request sent!");

        if (window.location.hash === '#resume-request') {
            document.getElementById('resume-request').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
